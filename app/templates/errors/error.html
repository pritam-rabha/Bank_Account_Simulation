{% extends "base.html" %}
{% block title %}{{ code }} {{ title }}{% endblock %}
{% block content %}
<section class="error-page" aria-labelledby="err-title">
  <div class="code">{{ code }}</div>
  <h1 id="err-title" class="h3 mt-3">{{ title }}</h1>
  <p class="text-muted mx-auto mb-4">{{ message }}</p>
  <div class="d-flex gap-2 justify-content-center">
    <a class="btn btn-primary" href="{{ url_for('bank.dashboard') if current_account else url_for('bank.home') }}">{{ 'Back to dashboard' if current_account else 'Go to home' }}</a>
    {% if not current_account %}<a class="btn btn-outline-secondary" href="{{ url_for('bank.login') }}">PIN login</a>{% endif %}
  </div>
</section>
{% endblock %}
